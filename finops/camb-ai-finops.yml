meters:
- name: subscription
  description: Monthly (or annual) subscription fee for the chosen plan tier.
  unit: plan
  aggregation: sum
  dimensions:
  - account
  - plan
- name: credits
  description: Credits consumed across all products (TTS, dubbing, translation, transcription); allocated monthly by plan.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - product
  - workload
- name: custom_voices
  description: Stored custom (cloned or designed) voices, capped per plan.
  unit: voices
  aggregation: max
  dimensions:
  - account
- name: live_streaming
  description: Realtime live-streaming minutes, available on higher tiers.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track credit consumption per product (TTS, dubbing, translation, transcription) and per workload; use response credit headers to attribute cost.
- name: Allocation
  description: Map team members and concurrent teams to internal cost centers so subscription and credit spend can be attributed.
- name: Optimization
  description: Right-size the plan tier to expected monthly credit consumption; prefer annual billing for steady usage; keep TTS text within per-generation limits and reuse voices to avoid unnecessary custom-voice churn.
- name: Accountability
  description: Assign an owner for the Camb.AI subscription; review monthly credit burn against the plan allowance and upgrade or downgrade tiers accordingly.

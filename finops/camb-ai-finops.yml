description: >-
  FinOps view of Camb.AI spend. Camb.AI is billed as a monthly (or discounted
  annual) subscription that bundles a fixed allowance of credits, which are then
  consumed across text-to-speech, dubbing, translation, audiobooks, and speech
  recognition. Cost management is therefore a matter of choosing the right tier
  for expected credit consumption and tracking how credits are spent per product
  and per workload. Higher tiers raise the credit allowance and lift ceilings on
  characters per generation, custom voices, media file size, teams, and live
  streaming. Per-operation credit rates are metered by the API (for example the
  X-Credits-Required header on streaming TTS) but are not reconciled to dollar
  amounts here.
notes: >-
  Subscription prices and allowances were read from the public pricing page and
  are subject to change - verify at https://www.camb.ai/pricing. The dominant
  cost lever is matching the plan's monthly credit allowance to actual multi-
  product usage.

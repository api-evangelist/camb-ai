  description: Convert text into natural speech with the MARS voice models. Includes a
    streaming endpoint (POST /tts-stream) that returns a binary audio stream, a
    deprecated task-based create endpoint (POST /tts), status polling (GET /tts/{task_id}),
    and audio retrieval (GET /tts-result/{run_id}), plus a public WebSocket for
    real-time low-latency synthesis with optional word-level timestamps.
- aid: camb-ai:camb-ai-dubbing-api
  name: Camb.AI Dubbing API
  tags:
  - Dubbing
  - Localization
  - Video
  - Audio
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.camb.ai/api-reference/endpoint/end-to-end-dubbing
  baseURL: https://client.camb.ai/apis

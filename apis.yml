  - url: openapi/camb-ai-openapi.yml
    type: OpenAPI
  - url: collections/camb-ai.postman_collection.json
    type: PostmanCollection
  - url: collections/camb-ai.opencollection.json
    type: OpenCollection
  description: End-to-end video and audio dubbing that preserves emotional delivery.
    Submit a media URL with a source language and one or more target languages
    (POST /dub), poll the task (GET /dub/{task_id}) for status, then retrieve the
    dubbed outputs and translated transcripts per target language.

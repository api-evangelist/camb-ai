name: Camb.AI
kind: company
description: Camb.AI is a generative voice AI platform for translation, dubbing, and
  speech. Its research models - MARS (text-to-speech and voice cloning) and BOLI
  (neural translation) - power an API covering text-to-speech, end-to-end video and
  audio dubbing, text translation across 140+ languages, voice discovery and custom
  voice cloning, and speech-to-text transcription. The REST API lives at
  https://client.camb.ai/apis, is authenticated with an x-api-key header, and follows
  an asynchronous create-and-poll pattern (POST to start a task, GET the task by id
  until it succeeds, then fetch the result). Camb.AI also exposes public WebSocket
  surfaces for real-time streaming TTS, live transcription, and realtime
  speech-to-speech translation.
